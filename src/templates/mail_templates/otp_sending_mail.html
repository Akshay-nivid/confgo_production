<html lang="en">

<head>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script>
        window.onload = function () {
            document.getElementById("year").textContent = new Date().getFullYear();
        };
    </script>
</head>

<body style="background: #F8F9FA;color: #3c4043; margin: 0;font-family: 'Inter', sans-serif; padding: 30px 0; -webkit-font-smoothing: subpixel-antialiased;
    -webkit-text-stroke:1px transparent;">
    <div>
        <table style="margin: 0 auto; background: #F2F5F8;border-spacing: 0;">
            <tbody>
                <tr style="width: 600px; background: #F2F5F8;">
                    <td style="background: #F2F5F8;vertical-align: baseline;width: 600px;">
                        <img width="150px" src="https://confgo.com/assets/logo2.png"
                            style="margin: 0 auto;display: block;padding: 30px;">
                    </td>
                </tr>
            </tbody>

            <table style="width: 570px;background: #fff;margin: 0 auto;border-spacing: 0;border-radius: 5px;">
                <tbody>
                    <tr>
                        <td style="width: 600px; padding: 30px;">
                            <div>
                                <p style="margin: 0;padding: 14px;color: #384860;font-size: 20px;font-weight: 600;">
                                    Your OTP Code
                                </p>

                                <p style="margin: 0;padding: 0px 14px 10px;color: #384860;font-size: 16px;font-weight: 600;">
                                    Hello {{contactName}},
                                </p>

                                <p style="margin: 0;padding: 14px;font-size: 24px;font-weight: bold;color: #C4095E;text-align: center;">
                                    {{otp}}
                                </p>

                                <p style="margin: 0;padding: 0px 14px 10px;color: #384860;font-size: 16px;">
                                    This OTP will expire in 10 minutes. Do not share it with anyone.
                                </p>

                                <p style="margin: 0;padding: 0px 14px 10px;color: #384860;font-size: 16px;">
                                    If you did not request this OTP, please ignore this email.
                                </p>

                                <p style="margin: 0;padding: 0px 14px 10px;color: #384860;font-size: 16px;">
                                    Regards,<br>Team ConfGo
                                </p>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <table style="background: #262534;width: 600px;padding: 30px;margin-top: 20px;text-align: center;">
                <tbody>
                    <tr>
                        <td style="color: #fff; font-size: 14px;">
                            ©{{year}} ConfGo.com All rights reserved
                        </td>
                    </tr>
                </tbody>
            </table>
        </table>
    </div>
</body>

</html>
